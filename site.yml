---
- name: Prepare all nodes
  hosts: k3s_cluster
  gather_facts: yes
  become: yes
  roles:
    - role: prereq

- name: Setup k3s server
  hosts: master
  become: yes
  roles:
    - role: k3s-server

- name: Setup k3s agents
  hosts: worker
  become: yes
  roles:
    - role: k3s-agent

- name: Deploy test applications
  hosts: master
  gather_facts: yes
  become: no
  roles:
    - role: k3s-deploy-test
  tags:
    - test
    - deploy-test
