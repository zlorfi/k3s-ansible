---
- name: Prepare all nodes
  hosts: k3s_cluster
  gather_facts: true
  become: true
  roles:
    - role: prereq
  tags:
    - prereq
    - prepare

- name: Setup k3s server
  hosts: master
  become: true
  roles:
    - role: k3s-server
  tags:
    - k3s-server
    - server
    - master

- name: Setup k3s agents
  hosts: worker
  become: true
  roles:
    - role: k3s-agent
  tags:
    - k3s-agent
    - agent
    - worker

- name: Install compute-blade-agent
  hosts: worker
  become: true
  roles:
    - role: compute-blade-agent
  tags:
    - compute-blade-agent
    - blade-agent

- name: Deploy test applications
  hosts: master
  gather_facts: true
  become: false
  roles:
    - role: k3s-deploy-test
  tags:
    - test
    - deploy-test
