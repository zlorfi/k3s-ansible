[package]
name = "mikrotik-cli"
version = "0.1.0"
edition = "2021"
authors = ["k3s-ansible"]
description = "MikroTik RouterOS PoE control CLI written in Rust"
readme = "README.md"
license = "MIT"

[[bin]]
name = "mikrotik"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive", "env", "cargo"] }
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"
hex = "0.4"
md5 = "0.7"
dotenv = "0.15"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
