---
- name: Set hostname
  hostname:
    name: "{{ inventory_hostname }}"

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Upgrade all packages
  apt:
    upgrade: dist
    autoremove: yes
    autoclean: yes

- name: Install required packages
  apt:
    name:
      - curl
      - wget
      - git
      - python3-pip
      - iptables
      - conntrack
      - apparmor
      - apparmor-utils
    state: present

- name: Install extra packages
  apt:
    name: "{{ extra_packages.split(',') }}"
    state: present
  when: extra_packages is defined and extra_packages | length > 0

- name: Ensure [cm4] section exists in boot config
  lineinfile:
    path: /boot/firmware/config.txt
    line: '[cm4]'
    state: present

- name: Configure CM4 UART settings (enable_uart)
  lineinfile:
    path: /boot/firmware/config.txt
    insertafter: '^\[cm4\]'
    line: 'enable_uart=1'
    state: present

- name: Configure CM4 UART settings (uart5 overlay)
  lineinfile:
    path: /boot/firmware/config.txt
    insertafter: '^enable_uart=1'
    line: 'dtoverlay=uart5'
    state: present

# The negative lookahead keeps this idempotent. Without it the regexp matches
# the rootwait line on every run and appends a duplicate copy of the cgroup
# parameters, which also makes the reboot handler below fire every time.
- name: Enable cgroup memory and swap
  lineinfile:
    path: /boot/firmware/cmdline.txt
    backrefs: yes
    regexp: '^(?!.*cgroup_enable=memory)(.*rootwait.*)$'
    line: '\1 cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory'
  register: cmdline

# Raspberry Pi OS kernels 6.18+ no longer ship the legacy x_tables modules
# (ip_tables.ko / iptable_nat.ko). Forcing the legacy backend there makes
# kube-proxy fail with "can't initialize iptables table `nat'", which k3s
# treats as fatal and turns into a permanent service crash-loop.
- name: Select nft iptables backend
  alternatives:
    name: iptables
    path: /usr/sbin/iptables-nft

- name: Select nft ip6tables backend
  alternatives:
    name: ip6tables
    path: /usr/sbin/ip6tables-nft

- name: Disable swap
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Remove swap from /etc/fstab
  lineinfile:
    path: /etc/fstab
    regexp: '^.*swap.*$'
    state: absent

- name: Reboot if cmdline was changed
  reboot:
    reboot_timeout: 600
  when: cmdline.changed

- name: Wait for system to become reachable
  wait_for_connection:
    delay: 10
    timeout: 300
  when: cmdline.changed
