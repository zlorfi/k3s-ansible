---
- name: Install Telegraf from package archive
  shell: |
    cd /tmp
    wget -q https://dl.influxdata.com/telegraf/releases/telegraf_1.29.2-1_arm64.deb
    dpkg -i telegraf_1.29.2-1_arm64.deb || apt-get install -f -y
    rm -f telegraf_1.29.2-1_arm64.deb
  args:
    creates: /usr/bin/telegraf
  become: true
  register: telegraf_install

- name: Create Telegraf configuration directory
  file:
    path: /etc/telegraf/telegraf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Deploy Telegraf configuration
  template:
    src: telegraf.conf.j2
    dest: /etc/telegraf/telegraf.conf
    owner: root
    group: telegraf
    mode: '0640'
    backup: true
  become: true
  register: telegraf_config

- name: Ensure Telegraf service is started and enabled
  systemd:
    name: telegraf
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Restart Telegraf if configuration changed
  systemd:
    name: telegraf
    state: restarted
  become: true
  when: telegraf_config.changed

- name: Verify Telegraf is running
  systemd:
    name: telegraf
    state: started
  become: true
  register: telegraf_status

- name: Display Telegraf installation status
  debug:
    msg: |
      Telegraf installation complete on {{ inventory_hostname }}
      InfluxDB Configuration:
      - Host: {{ influxdb_host }}:{{ influxdb_port }}
      - Organization: {{ influxdb_org }}
      - Bucket: {{ influxdb_bucket }}
      - Node Tag: {{ inventory_hostname }}
      - Node Type: {{ 'master' if inventory_hostname in groups['master'] else 'worker' }}

      Service Status: {{ telegraf_status.status.ActiveState }}

      To view logs:
        sudo journalctl -u telegraf -f
