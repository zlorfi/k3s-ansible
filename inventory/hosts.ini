[master]
# K3s master/control-plane nodes (3-node HA cluster for redundancy)
# Primary master that initializes the cluster
cm4-01 ansible_host=192.168.30.101 ansible_user=pi k3s_server_init=true
# Additional masters that join the cluster
cm4-02 ansible_host=192.168.30.102 ansible_user=pi k3s_server_init=false
cm4-03 ansible_host=192.168.30.103 ansible_user=pi k3s_server_init=false

[worker]
# K3s worker nodes
cm4-04 ansible_host=192.168.30.104 ansible_user=pi
cm5-01 ansible_host=192.168.30.105 ansible_user=pi

[k3s_cluster:children]
master
worker

[k3s_cluster:vars]
# K3s version to install
# Use 'latest' for auto-updates, or specify a version like 'v1.29.0+k3s1'
k3s_version=v1.36.1+k3s1

# Network settings
ansible_user=pi
ansible_python_interpreter=/usr/bin/python3

# K3s configuration
# Flannel backend (vxlan is recommended for ARM)
extra_server_args="--flannel-backend=vxlan"
extra_agent_args=""

# Extra packages to install on all nodes
# Add or remove packages as needed (comma-separated list)
extra_packages=btop,vim,tmux,net-tools,dnsutils,iotop,ncdu,tree,jq

# Compute Blade Agent configuration
# Set to false to skip compute-blade-agent deployment on specific nodes
enable_compute_blade_agent=true

# enable Prometheus
enable_prometheus_operator=true
